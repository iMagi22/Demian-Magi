<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escena 8-Bits - Demian y Ella</title>
  <style>
    body {
      background-color: #0d0e15;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 30px rgba(255, 121, 198, 0.4);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #bd93f9;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 20px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 3px 3px 0px #000;
    }

    button:hover {
      background: #ff79c6;
      color: #fff;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <canvas id="gameCanvas" width="320" height="240"></canvas>
  </div>

  <div class="controls">
    <button onclick="startAnimation()">▶ Reproducir</button>
    <button onclick="resetAnimation()">↺ Reiniciar</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalar la vista sin perder la nitidez
    canvas.style.width = (canvas.width * 2.5) + 'px';
    canvas.style.height = (canvas.height * 2.5) + 'px';

    let frame = 0;
    let animState = 0; // 0: Inicio, 1: "Mira una cámara!", 2: Voltean a la cámara, 3: "DEMIAN!" + Flores + Ojos Corazón, 4: Beso
    let timer = 0;
    let particles = [];

    // Posiciones
    let boyX = 175;
    let girlX = 135; // Ella del lado izquierdo

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // Fondo: Casa en la izquierda con cámara de seguridad, noche y estrellas
    function drawBackground() {
      // Cielo Nocturno
      drawPixelRect(0, 0, 320, 170, '#0a0c16');

      // Estrellas
      let stars = [[10, 15], [50, 30], [90, 10], [140, 25], [210, 15], [260, 35], [290, 12], [180, 50]];
      stars.forEach(([sx, sy], i) => {
        if ((frame + i * 10) % 40 < 25) {
          drawPixelRect(sx, sy, 2, 2, '#ffffff');
        }
      });

      // Luna
      drawPixelRect(270, 15, 20, 20, '#ffffe0');
      drawPixelRect(268, 18, 24, 14, '#ffffe0');

      // --- CASA EN EL LADO IZQUIERDO ---
      // Paredes de la casa
      drawPixelRect(0, 50, 110, 120, '#2b2e3a');
      // Techo
      drawPixelRect(0, 40, 120, 10, '#1a1c23');
      drawPixelRect(0, 32, 115, 8, '#ff5555');
      // Ventana iluminada
      drawPixelRect(25, 70, 30, 40, '#f1fa8c');
      drawPixelRect(25, 70, 30, 2, '#1a1c23');
      drawPixelRect(39, 70, 2, 40, '#1a1c23');
      drawPixelRect(25, 88, 30, 2, '#1a1c23');
      // Puerta
      drawPixelRect(70, 110, 30, 60, '#181920');
      drawPixelRect(92, 138, 3, 3, '#f1fa8c'); // Perilla

      // CÁMARA DE SEGURIDAD (Esquina superior izquierda de la casa)
      drawPixelRect(100, 52, 10, 4, '#6272a4'); // Soporte
      drawPixelRect(108, 54, 14, 8, '#f8f8f2'); // Cuerpo cámara
      drawPixelRect(120, 56, 4, 4, '#111116');  // Lente
      // Luz roja parpadeante de la cámara
      if (Math.floor(frame / 20) % 2 === 0) {
        drawPixelRect(118, 54, 3, 3, '#ff5555');
      }

      // Suelo / Banqueta
      drawPixelRect(0, 170, 320, 70, '#1e2029');
      drawPixelRect(0, 170, 320, 4, '#44475a');
      // Líneas de pavimento
      for(let i=0; i<320; i+=40) {
        drawPixelRect(i, 200, 20, 2, '#282a36');
      }
    }

    // Dibujar a DEMIAN (Audífonos, musculoso, barba, camiseta negra)
    function drawBoy(x, y, showFlowers = false, pose = 'normal') {
      let lookLeft = (pose === 'look_cam');

      // Audífonos grandes
      drawPixelRect(x - 2, y + 2, 4, 10, '#ff5555');
      drawPixelRect(x + 14, y + 2, 4, 10, '#ff5555');
      drawPixelRect(x + 1, y - 2, 14, 4, '#282a36');

      // Cabello castaño/oscuro
      drawPixelRect(x + 2, y, 12, 6, '#281a14');

      // Rostro
      drawPixelRect(x + 2, y + 5, 12, 10, '#f1c27d');

      // Ojos y Barba
      if (lookLeft) {
        drawPixelRect(x + 3, y + 8, 2, 3, '#111'); // Ojo mirando a la izq
        drawPixelRect(x + 7, y + 8, 2, 3, '#111');
      } else {
        drawPixelRect(x + 4, y + 8, 2, 3, '#111'); // Ojo izq
        drawPixelRect(x + 9, y + 8, 2, 3, '#111'); // Ojo der
      }
      // Detalle barba fina
      drawPixelRect(x + 3, y + 13, 10, 2, '#5a3d28');

      // Camiseta Negra con Estampado
      drawPixelRect(x, y + 15, 16, 16, '#111116');
      drawPixelRect(x + 3, y + 18, 10, 8, '#ff3344'); // Estampado rojo estilo metal/gym

      // Brazos Musculosos
      if (pose === 'hug') {
        drawPixelRect(x - 6, y + 16, 10, 6, '#f1c27d');
      } else if (showFlowers) {
        // Brazo extendido entregando flores
        drawPixelRect(x - 8, y + 17, 10, 5, '#f1c27d');
        // Ramo de Flores detallado
        let fx = x - 18;
        let fy = y + 12;
        drawPixelRect(fx + 4, fy + 8, 4, 10, '#50fa7b'); // Tallos verdes
        drawPixelRect(fx, fy - 2, 12, 10, '#ff79c6');    // Flores rosas
        drawPixelRect(fx + 2, fy - 4, 8, 10, '#ffb86c');  // Flores amarillas
        drawPixelRect(fx + 4, fy + 1, 4, 4, '#ff5555');   // Centro rojo
      } else {
        drawPixelRect(x - 5, y + 15, 5, 14, '#f1c27d'); // Bíceps izq
        drawPixelRect(x + 16, y + 15, 5, 14, '#f1c27d'); // Bíceps der
      }

      // Pantalones oscuros estilo gym
      drawPixelRect(x + 1, y + 31, 14, 16, '#1a1b26');
      drawPixelRect(x + 1, y + 32, 2, 12, '#ffffff'); // Franja lateral blanca
      drawPixelRect(x, y + 47, 6, 5, '#282a36');     // Tenis
      drawPixelRect(x + 10, y + 47, 6, 5, '#282a36');
    }

    // Dibujar a la CHICA (Lado Izquierdo - Flequillo, mechas rojas, lentes cat-eye)
    function drawGirl(x, y, heartEyes = false, pose = 'normal') {
      let lookLeft = (pose === 'look_cam');

      // Cabello largo negro con movimiento
      drawPixelRect(x - 4, y - 2, 22, 28, '#0d0d12');

      // Flequillo y Mechas Rojas prominentes
      drawPixelRect(x + 1, y - 1, 12, 5, '#ff2244');  // Flequillo rojo
      drawPixelRect(x - 3, y + 3, 5, 18, '#ff2244');   // Mecha roja izq
      drawPixelRect(x + 13, y + 5, 4, 16, '#ff2244');  // Mecha roja der

      // Rostro
      drawPixelRect(x + 2, y + 5, 12, 9, '#ffdbac');

      // Lentes Cat-Eye Negros
      drawPixelRect(x + 1, y + 5, 14, 5, '#000000');
      drawPixelRect(x, y + 4, 3, 2, '#000000');
      drawPixelRect(x + 13, y + 4, 3, 2, '#000000');
      // Vidrios
      drawPixelRect(x + 3, y + 6, 3, 3, '#ffffff');
      drawPixelRect(x + 10, y + 6, 3, 3, '#ffffff');

      // Ojos de Corazón al emocionarse
      if (heartEyes) {
        drawPixelRect(x + 2, y + 5, 5, 5, '#ff3366');
        drawPixelRect(x + 9, y + 5, 5, 5, '#ff3366');
        drawPixelRect(x + 3, y + 5, 3, 2, '#ff79c6');
        drawPixelRect(x + 10, y + 5, 3, 2, '#ff79c6');
      }

      // Labios Rojos
      drawPixelRect(x + 6, y + 11, 4, 2, '#ff1133');

      // Camiseta oscura estilo alternativa
      drawPixelRect(x + 1, y + 14, 14, 15, '#181920');
      drawPixelRect(x + 4, y + 17, 8, 8, '#ff5555'); // Gráfico frontal

      // Brazos
      if (pose === 'excited') {
        // Brazos arriba emocionada
        drawPixelRect(x - 4, y + 8, 5, 9, '#ffdbac');
        drawPixelRect(x + 13, y + 8, 5, 9, '#ffdbac');
      } else if (pose === 'hug') {
        drawPixelRect(x + 8, y + 15, 10, 5, '#ffdbac');
      } else {
        drawPixelRect(x - 2, y + 14, 4, 12, '#ffdbac');
        drawPixelRect(x + 12, y + 14, 4, 12, '#ffdbac');
      }

      // Pantalones oscuros y Calzado
      drawPixelRect(x + 2, y + 29, 12, 17, '#282a36');
      drawPixelRect(x + 1, y + 46, 5, 5, '#111');
      drawPixelRect(x + 8, y + 46, 5, 5, '#111');
    }

    // Partículas de Corazones Flotando
    function createHeartParticle(x, y) {
      particles.push({
        x: x + (Math.random() * 20 - 10),
        y: y,
        vy: - (Math.random() * 0.8 + 0.4),
        life: 50,
        color: Math.random() > 0.5 ? '#ff5555' : '#ff79c6'
      });
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        // Corazón en Pixel Art
        drawPixelRect(p.x, p.y, 6, 6, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 4, 1, p.color);
        drawPixelRect(p.x + 2, p.y + 6, 2, 1, p.color);

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // Cuadro de Subtítulos / Diálogo estilo RPG Pixel Art
    function drawSubtitle(text, speaker = "") {
      drawPixelRect(20, 180, 280, 48, '#000000');
      drawPixelRect(22, 182, 276, 44, '#ffffff');
      drawPixelRect(24, 184, 272, 40, '#111116');

      ctx.fillStyle = '#ff79c6';
      ctx.font = 'bold 11px monospace';
      if (speaker) {
        ctx.fillText(speaker, 32, 198);
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      ctx.fillText(text, 32, speaker ? 212 : 205);
    }

    // Bucle principal (Game Loop)
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();

      if (animState === 0) {
        // Parados frente a la casa
        drawGirl(girlX, 120, false, 'normal');
        drawBoy(boyX, 120, false, 'normal');
      } 
      else if (animState === 1) {
        // Demian dice: "¡Mira una cámara de seguridad!"
        timer++;
        drawGirl(girlX, 120, false, 'normal');
        drawBoy(boyX, 120, false, 'normal');
        drawSubtitle("¡Mira, una cámara de seguridad!", "DEMIAN:");

        if (timer > 90) {
          animState = 2;
          timer = 0;
        }
      } 
      else if (animState === 2) {
        // Ambos voltean a ver la cámara de seguridad
        timer++;
        drawGirl(girlX, 120, false, 'look_cam');
        drawBoy(boyX, 120, false, 'look_cam');

        if (timer > 70) {
          animState = 3;
          timer = 0;
        }
      } 
      else if (animState === 3) {
        // Demian saca las flores, Ella grita "¡DEMIAN!" con ojos de amor
        timer++;
        drawGirl(girlX, 120, true, 'excited');
        drawBoy(boyX, 120, true, 'normal');
        drawSubtitle("¡DEMIAN! 😍", "ELLA:");

        if (timer > 90) {
          animState = 4;
          girlX = 148;
          boyX = 162;
        }
      } 
      else if (animState === 4) {
        // ¡BESO Y CORAZONES FLOTANDO!
        drawGirl(girlX, 120, true, 'hug');
        drawBoy(boyX, 120, true, 'hug');

        // Corazón brillante arriba
        drawPixelRect(151, 104, 10, 10, '#ff3344');

        if (frame % 6 === 0) {
          createHeartParticle(152, 110);
        }

        drawSubtitle("¡Un beso frente a la cámara! 💖");
      }

      updateAndDrawParticles();
      requestAnimationFrame(gameLoop);
    }

    function startAnimation() {
      if (animState === 0) {
        animState = 1;
        timer = 0;
      }
    }

    function resetAnimation() {
      animState = 0;
      boyX = 175;
      girlX = 135;
      timer = 0;
      particles = [];
    }

    // Iniciar loop del canvas
    gameLoop();
  </script>
</body>
</html>
