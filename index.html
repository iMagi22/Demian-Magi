<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escena 8-Bits - Demian y Ella</title>
  <style>
    body {
      background-color: #050608;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 16px;
      color: #ff79c6;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 2px 2px #000;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 35px rgba(255, 121, 198, 0.4);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #bd93f9;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 22px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #ff79c6;
      color: #fff;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <h1>[ ROMANTIC 8-BIT STORY ]</h1>

  <div class="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
  </div>

  <div class="controls">
    <button onclick="startAnimation()">▶ Reproducir Historia</button>
    <button onclick="resetAnimation()">↺ Reiniciar Escena</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalado de lienzo
    canvas.style.width = (canvas.width * 2.3) + 'px';
    canvas.style.height = (canvas.height * 2.3) + 'px';

    let frame = 0;
    let animState = 0; 
    /*
      0: Inicio parados frente al auto
      1: "¡Mira, una cámara de seguridad!" (Demian señala)
      2: Ambos VOLTEAN a la cámara de seguridad
      3: Demian va a la puerta trasera (a la derecha del auto)
      4: Abre la puerta trasera y saca el ramo
      5: Vuelve con ella y le entrega el ramo
      6: Ella reacciona ("¡DEMIAN!") emocionada
      7: Beso + Corazones
    */

    let timer = 0;
    let particles = [];

    // Posiciones
    let girlX = 175;
    let boyX = 210;
    let doorOpen = false;

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // NOCHE DETALLADA (Cielo, nubes pixel, casas secundarias, luz urbana)
    function drawBackground() {
      // Degradado del Cielo Nocturno
      drawPixelRect(0, 0, 480, 80, '#060712');
      drawPixelRect(0, 80, 480, 60, '#0a0d1d');
      drawPixelRect(0, 140, 480, 50, '#111528');

      // Estrellas Titilantes
      let stars = [
        [15, 20], [50, 35], [90, 15], [140, 28], [210, 15], [260, 35], 
        [320, 18], [370, 40], [420, 12], [450, 50], [180, 55], [300, 70]
      ];
      stars.forEach(([sx, sy], i) => {
        if ((frame + i * 8) % 35 < 24) {
          drawPixelRect(sx, sy, 2, 2, '#ffffff');
        }
      });

      // Luna brillante
      drawPixelRect(410, 18, 24, 24, '#ffffd0');
      drawPixelRect(406, 22, 32, 16, '#ffffd0');

      // Nubes flotantes lentas
      let cloudOffset = (frame * 0.25) % 520;
      let clouds = [
        [cloudOffset - 40, 25], [cloudOffset + 180 - 520, 40], [cloudOffset + 380 - 520, 20]
      ];
      clouds.forEach(([cx, cy]) => {
        drawPixelRect(cx, cy, 50, 8, 'rgba(40, 50, 80, 0.4)');
        drawPixelRect(cx + 10, cy - 4, 30, 12, 'rgba(40, 50, 80, 0.4)');
      });

      // --- CASITAS AL FONDO (Siluetas distantes) ---
      // Casa fondo 1
      drawPixelRect(130, 110, 45, 80, '#131625');
      drawPixelRect(138, 125, 10, 12, '#ffe375'); // Ventana encendida
      drawPixelRect(155, 145, 10, 12, '#1e2338');

      // Casa fondo 2 (edificio pequeño)
      drawPixelRect(280, 100, 55, 90, '#101322');
      drawPixelRect(290, 115, 12, 14, '#ffb86c');
      drawPixelRect(312, 115, 12, 14, '#1a1f33');
      drawPixelRect(290, 140, 12, 14, '#ffb86c');

      // Casa fondo 3
      drawPixelRect(380, 118, 60, 72, '#141829');
      drawPixelRect(395, 130, 14, 18, '#ffe375');

      // --- CASA PRINCIPAL IZQUIERDA CON CÁMARA ---
      drawPixelRect(0, 40, 130, 150, '#1c1f2e');
      drawPixelRect(0, 30, 140, 10, '#121420');
      drawPixelRect(0, 22, 135, 8, '#ff3344'); // Moldura roja

      // Ventana principal cálida
      drawPixelRect(25, 65, 40, 50, '#f1fa8c');
      drawPixelRect(25, 65, 40, 3, '#121420');
      drawPixelRect(44, 65, 3, 50, '#121420');
      drawPixelRect(25, 90, 40, 3, '#121420');

      // Puerta
      drawPixelRect(85, 120, 35, 70, '#0d0e17');
      drawPixelRect(112, 155, 3, 4, '#ffb86c');

      // CÁMARA DE SEGURIDAD (Apuntando a la pareja)
      drawPixelRect(118, 48, 12, 4, '#6272a4');
      drawPixelRect(128, 50, 16, 9, '#f8f8f2');
      drawPixelRect(142, 53, 5, 5, '#111116');
      if (Math.floor(frame / 15) % 2 === 0) {
        drawPixelRect(138, 51, 3, 3, '#ff3344'); // Luz roja rec
      }

      // --- CARRO NEGRO (Volteado: Conductor Izq / Puerta Trasera Der, Justo Detrás) ---
      let carX = 175; 
      let carY = 142;

      // Sombra
      drawPixelRect(carX - 5, carY + 28, 115, 6, '#06070a');

      // Carrocería Negra
      drawPixelRect(carX, carY + 10, 105, 20, '#101117'); 
      drawPixelRect(carX + 25, carY, 65, 14, '#191b24'); // Techo
      // Ventanas (Conductor Izquierda, Trasera Derecha)
      drawPixelRect(carX + 31, carY + 2, 26, 10, '#3d4052'); // Ventana Conductor (Izq)
      drawPixelRect(carX + 61, carY + 2, 22, 10, '#3d4052'); // Ventana Trasera (Der)

      // Faros
      drawPixelRect(carX + 1, carY + 12, 3, 6, '#ff2233');   // Luz trasera (Izquierda)
      drawPixelRect(carX + 102, carY + 12, 3, 6, '#ffffd0'); // Faro delantero (Derecha)

      // PUERTA TRASERA ABIERTA (Lado Derecho del auto)
      if (doorOpen) {
        drawPixelRect(carX + 61, carY + 2, 8, 26, '#050508'); // Apertura
        drawPixelRect(carX + 67, carY + 4, 8, 24, '#242735'); // Puerta abierta
      }

      // Llantas
      drawPixelRect(carX + 18, carY + 22, 18, 12, '#050507');
      drawPixelRect(carX + 72, carY + 22, 18, 12, '#050507');
      drawPixelRect(carX + 23, carY + 25, 8, 6, '#6272a4');
      drawPixelRect(carX + 77, carY + 25, 8, 6, '#6272a4');

      // --- SUELO Y BANQUETA ---
      drawPixelRect(0, 190, 480, 80, '#14151e');
      drawPixelRect(0, 190, 480, 4, '#32344a');
      for(let i = 0; i < 480; i += 50) {
        drawPixelRect(i, 230, 25, 3, '#222330');
      }
    }

    // DIBUJAR A DEMIAN (Estilizado)
    function drawBoy(x, y, showFlowers = false, pose = 'normal') {
      let lookCam = (pose === 'look_cam');

      // Audífonos
      drawPixelRect(x - 2, y + 2, 4, 11, '#ff3344');
      drawPixelRect(x + 14, y + 2, 4, 11, '#ff3344');
      drawPixelRect(x + 1, y - 3, 14, 4, '#282a36');

      // Cabello castaño oscuro
      drawPixelRect(x + 2, y, 12, 6, '#211510');

      // Rostro
      drawPixelRect(x + 2, y + 5, 12, 11, '#f1c27d');

      if (lookCam) {
        // Mirada hacia la cámara (Arriba Izquierda)
        drawPixelRect(x + 1, y + 6, 3, 3, '#ffffff');
        drawPixelRect(x + 1, y + 6, 2, 2, '#111');
        drawPixelRect(x + 6, y + 6, 3, 3, '#ffffff');
        drawPixelRect(x + 6, y + 6, 2, 2, '#111');
        drawPixelRect(x + 1, y + 13, 11, 3, '#4a3322');
      } else {
        // Mirada normal
        drawPixelRect(x + 4, y + 8, 2, 3, '#111');
        drawPixelRect(x + 9, y + 8, 2, 3, '#111');
        drawPixelRect(x + 2, y + 13, 12, 3, '#4a3322');
        drawPixelRect(x + 5, y + 12, 6, 1, '#4a3322');
      }

      // Camiseta Negra con Estampado Rojo
      drawPixelRect(x, y + 16, 16, 17, '#111116');
      drawPixelRect(x + 3, y + 19, 10, 9, '#ff3344');

      // Brazos
      if (pose === 'hug') {
        drawPixelRect(x - 8, y + 17, 10, 6, '#f1c27d');
      } else if (showFlowers) {
        drawPixelRect(x - 8, y + 18, 10, 6, '#f1c27d');
        let fx = x - 20;
        let fy = y + 10;
        drawPixelRect(fx + 5, fy + 10, 4, 12, '#50fa7b');
        drawPixelRect(fx - 2, fy - 4, 14, 12, '#ff79c6');
        drawPixelRect(fx, fy - 6, 10, 12, '#ffb86c');
        drawPixelRect(fx + 3, fy - 1, 5, 5, '#ff3344');
      } else if (pose === 'point') {
        drawPixelRect(x - 12, y + 10, 14, 4, '#f1c27d');
        drawPixelRect(x + 16, y + 16, 5, 12, '#f1c27d');
      } else {
        drawPixelRect(x - 5, y + 16, 5, 15, '#f1c27d');
        drawPixelRect(x + 16, y + 16, 5, 15, '#f1c27d');
      }

      // Pantalones y Tenis
      drawPixelRect(x + 1, y + 33, 14, 18, '#181920');
      drawPixelRect(x + 1, y + 34, 2, 15, '#ffffff');
      drawPixelRect(x, y + 51, 6, 5, '#282a36');
      drawPixelRect(x + 10, y + 51, 6, 5, '#282a36');
    }

    // DIBUJAR A LA CHICA (Estilizada y Bonita)
    function drawGirl(x, y, heartEyes = false, pose = 'normal') {
      let lookCam = (pose === 'look_cam');

      // Cabello abundante largo
      drawPixelRect(x - 5, y - 3, 24, 32, '#08090d');

      // Mechas rojas en degradado
      drawPixelRect(x, y - 2, 14, 6, '#ff2244');
      drawPixelRect(x - 4, y + 3, 6, 22, '#ff2244');
      drawPixelRect(x + 12, y + 5, 5, 20, '#ff2244');

      // Rostro y Rubor
      drawPixelRect(x + 2, y + 5, 12, 10, '#ffe0bd');
      drawPixelRect(x + 2, y + 11, 3, 2, '#ff88a0');
      drawPixelRect(x + 11, y + 11, 3, 2, '#ff88a0');

      if (lookCam) {
        // Mirada directa a la cámara de seguridad
        drawPixelRect(x, y + 4, 13, 5, '#0d0d12');
        drawPixelRect(x - 2, y + 2, 4, 3, '#0d0d12');
        drawPixelRect(x + 1, y + 5, 4, 3, '#ffffff');
        drawPixelRect(x + 7, y + 5, 4, 3, '#ffffff');
        drawPixelRect(x + 1, y + 5, 2, 2, '#111');
        drawPixelRect(x + 7, y + 5, 2, 2, '#111');
      } else if (heartEyes) {
        drawPixelRect(x + 1, y + 5, 14, 5, '#0d0d12');
        drawPixelRect(x + 2, y + 5, 5, 5, '#ff3366');
        drawPixelRect(x + 9, y + 5, 5, 5, '#ff3366');
        drawPixelRect(x + 3, y + 5, 3, 2, '#ff79c6');
        drawPixelRect(x + 10, y + 5, 3, 2, '#ff79c6');
      } else {
        drawPixelRect(x + 1, y + 5, 14, 5, '#0d0d12');
        drawPixelRect(x - 1, y + 3, 4, 3, '#0d0d12');
        drawPixelRect(x + 13, y + 3, 4, 3, '#0d0d12');
        drawPixelRect(x + 3, y + 6, 3, 3, '#ffffff');
        drawPixelRect(x + 10, y + 6, 3, 3, '#ffffff');
      }

      // Labios
      drawPixelRect(x + 5, y + 12, 5, 2, '#ff1133');

      // Camiseta
      drawPixelRect(x + 1, y + 15, 14, 16, '#181924');
      drawPixelRect(x + 4, y + 18, 8, 8, '#ff5555');

      // Brazos
      if (pose === 'excited') {
        drawPixelRect(x - 5, y + 8, 5, 10, '#ffe0bd');
        drawPixelRect(x + 14, y + 8, 5, 10, '#ffe0bd');
      } else if (pose === 'hug') {
        drawPixelRect(x + 8, y + 16, 10, 5, '#ffe0bd');
      } else {
        drawPixelRect(x - 3, y + 15, 4, 14, '#ffe0bd');
        drawPixelRect(x + 13, y + 15, 4, 14, '#ffe0bd');
      }

      // Pantalón y Botas
      drawPixelRect(x + 2, y + 31, 12, 18, '#232533');
      drawPixelRect(x + 1, y + 49, 5, 7, '#0a0a0f');
      drawPixelRect(x + 8, y + 49, 5, 7, '#0a0a0f');
    }

    // Partículas
    function createHeartParticle(x, y) {
      particles.push({
        x: x + (Math.random() * 24 - 12),
        y: y,
        vy: - (Math.random() * 0.9 + 0.4),
        life: 55,
        color: Math.random() > 0.4 ? '#ff3366' : '#ff79c6'
      });
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        drawPixelRect(p.x, p.y, 6, 6, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 4, 1, p.color);
        drawPixelRect(p.x + 2, p.y + 6, 2, 1, p.color);

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // Subtítulos
    function drawSubtitle(text, speaker = "") {
      drawPixelRect(40, 210, 400, 48, '#000000');
      drawPixelRect(42, 212, 396, 44, '#ffffff');
      drawPixelRect(44, 214, 392, 40, '#111118');

      ctx.fillStyle = '#ff79c6';
      ctx.font = 'bold 12px monospace';
      if (speaker) {
        ctx.fillText(speaker, 56, 230);
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '12px monospace';
      ctx.fillText(text, 56, speaker ? 244 : 237);
    }

    // BUCLE DE HISTORIA
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();

      if (animState === 0) {
        // Inicio
        drawGirl(girlX, 134, false, 'normal');
        drawBoy(boyX, 134, false, 'normal');
      } 
      else if (animState === 1) {
        // 1. Demian señala la cámara
        timer++;
        drawGirl(girlX, 134, false, 'normal');
        drawBoy(boyX, 134, false, 'point');
        drawSubtitle("¡Mira, una cámara de seguridad!", "DEMIAN:");

        if (timer > 85) {
          animState = 2;
          timer = 0;
        }
      } 
      else if (animState === 2) {
        // 2. ¡Ambos voltean a ver la cámara de seguridad!
        timer++;
        drawGirl(girlX, 134, false, 'look_cam');
        drawBoy(boyX, 134, false, 'look_cam');

        if (timer > 75) {
          animState = 3;
          timer = 0;
        }
      } 
      else if (animState === 3) {
        // 3. Demian camina unos pasos a la PUERTA TRASERA (Derecha del auto)
        if (boyX < 240) {
          boyX += 1.2;
        } else {
          animState = 4;
          timer = 0;
        }
        drawGirl(girlX, 134, false, 'normal');
        drawBoy(boyX, 134, false, 'normal');
      } 
      else if (animState === 4) {
        // 4. Abre la puerta trasera (a la derecha) y saca el ramo
        timer++;
        doorOpen = true;
        drawGirl(girlX, 134, false, 'normal');
        drawBoy(boyX, 134, true, 'normal');

        if (timer > 60) {
          animState = 5;
        }
      } 
      else if (animState === 5) {
        // 5. Regresa con ella
        if (boyX > 210) {
          boyX -= 1.2;
        } else {
          animState = 6;
          timer = 0;
        }
        drawGirl(girlX, 134, false, 'normal');
        drawBoy(boyX, 134, true, 'normal');
      } 
      else if (animState === 6) {
        // 6. Ella reacciona "¡DEMIAN!"
        timer++;
        drawGirl(girlX, 134, true, 'excited');
        drawBoy(boyX, 134, true, 'normal');
        drawSubtitle("¡DEMIAN! 😍", "ELLA:");

        if (timer > 85) {
          animState = 7;
          girlX = 186;
          boyX = 200;
        }
      } 
      else if (animState === 7) {
        // 7. Beso y corazones
        drawGirl(girlX, 134, true, 'hug');
        drawBoy(boyX, 134, true, 'hug');

        drawPixelRect(190, 116, 12, 12, '#ff3344');

        if (frame % 5 === 0) {
          createHeartParticle(192, 122);
        }

        drawSubtitle("¡Un beso grabado frente a la cámara! 💖");
      }

      updateAndDrawParticles();
      requestAnimationFrame(gameLoop);
    }

    function startAnimation() {
      if (animState === 0) {
        animState = 1;
        timer = 0;
      }
    }

    function resetAnimation() {
      animState = 0;
      girlX = 175;
      boyX = 210;
      doorOpen = false;
      timer = 0;
      particles = [];
    }

    gameLoop();
  </script>
</body>
</html>
