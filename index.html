<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rata de Ciudad - Edición Ultra Pausada 8-Bits</title>
  <style>
    body {
      background-color: #050608;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 16px;
      color: #ff79c6;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 2px 2px #000;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 35px rgba(255, 121, 198, 0.3);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #ff79c6;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 22px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #50fa7b;
      color: #000;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <h1>[ LA RATA DE CIUDAD - LECTURA ULTRA LENTA ]</h1>

  <div class="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
  </div>

  <div class="controls">
    <button onclick="startStory()">▶ Iniciar Historia</button>
    <button onclick="resetStory()">↺ Reiniciar Escena</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalado de pantalla
    canvas.style.width = (canvas.width * 2.3) + 'px';
    canvas.style.height = (canvas.height * 2.3) + 'px';

    let frame = 0;
    let state = 0;
    let timer = 0;
    let particles = [];

    // Posiciones y cámara
    let cameraX = 0;
    let m1X = 30;
    let m2X = 5;
    let mY = 172;
    
    // El Gato Enemigo
    let catX = -120;
    let catY = 145;
    let catShow = false;

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x - cameraX), Math.round(y), w, h);
    }

    function drawFixedPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // FONDO: CALLEJÓN DE LA CIUDAD
    function drawBackground() {
      // Cielo nocturno urbano
      drawFixedPixelRect(0, 0, 480, 180, '#0a0914');
      drawFixedPixelRect(0, 100, 480, 80, '#121024');

      // Edificios lejanos con luces
      for (let i = -100; i < 900; i += 70) {
        drawPixelRect(i, 20, 60, 160, '#1a1829');
        for (let wy = 30; wy < 150; wy += 20) {
          if ((i + wy) % 3 === 0) {
            drawPixelRect(i + 10, wy, 8, 12, '#ffb86c');
            drawPixelRect(i + 35, wy, 8, 12, '#8be9fd');
          }
        }
      }

      // Edificios cercanos (Callejón)
      drawPixelRect(-150, 0, 120, 180, '#0f0d1a');
      drawPixelRect(300, 0, 150, 180, '#0f0d1a');
      drawPixelRect(650, 0, 200, 180, '#0f0d1a');

      // Suelo de Asfalto
      drawFixedPixelRect(0, 180, 480, 90, '#1c1b29');
      drawFixedPixelRect(0, 180, 480, 4, '#383552');

      // Tuberías y Cajas
      drawPixelRect(120, 140, 30, 40, '#282a36');
      drawPixelRect(280, 150, 25, 30, '#44475a');

      // Reflejos Neón
      drawPixelRect(80, 182, 40, 2, '#ff79c6');
      drawPixelRect(240, 182, 50, 2, '#bd93f9');
      drawPixelRect(480, 182, 60, 2, '#50fa7b');
    }

    // DIBUJAR GATO
    function drawCat(x, y) {
      if (!catShow) return;
      
      drawPixelRect(x, y + 10, 40, 20, '#111116');
      drawPixelRect(x + 32, y + 2, 22, 20, '#111116');
      drawPixelRect(x + 34, y - 6, 6, 8, '#111116');
      drawPixelRect(x + 46, y - 6, 6, 8, '#111116');
      drawPixelRect(x + 42, y + 8, 4, 5, '#f1fa8c');
      drawPixelRect(x + 50, y + 8, 4, 5, '#f1fa8c');
      drawPixelRect(x + 44, y + 9, 1, 3, '#000000');
      drawPixelRect(x + 52, y + 9, 1, 3, '#000000');
      
      let tailWiggle = Math.sin(frame * 0.2) * 4;
      drawPixelRect(x - 12, y + 8 + tailWiggle, 14, 4, '#111116');
      let leg = Math.sin(frame * 0.4) * 6;
      drawPixelRect(x + 5 + leg, y + 30, 6, 8, '#111116');
      drawPixelRect(x + 28 - leg, y + 30, 6, 8, '#111116');
    }

    // DIBUJAR RATA
    function drawMouse(x, y, isRight = true, isGirl = false, pose = 'normal') {
      let isMoving = (pose === 'walk' || pose === 'run');
      let speedMult = (pose === 'run') ? 0.25 : 0.1;
      let legOffset = isMoving ? Math.sin(frame * speedMult) * 3 : 0;
      let happyJump = (pose === 'happy' || pose === 'love') ? Math.abs(Math.sin(frame * 0.12)) * 4 : 0;
      let actualY = y - happyJump;

      let bodyColor = isGirl ? '#a88b80' : '#8b8c8e';
      let backColor = isGirl ? '#bc9e92' : '#a2a3a5';

      // Cuerpo
      drawPixelRect(x, actualY, 16, 10, bodyColor);
      drawPixelRect(x + 2, actualY - 2, 12, 3, backColor);

      // Orejas
      let earX = isRight ? x + 2 : x + 10;
      drawPixelRect(earX, actualY - 6, 5, 5, '#ffb86c');
      drawPixelRect(earX + 1, actualY - 5, 3, 3, '#ff9999');

      if (isGirl) {
        drawPixelRect(earX - 2, actualY - 6, 3, 3, '#ff79c6');
      }

      // Cabeza
      let headX = isRight ? x + 12 : x - 6;
      drawPixelRect(headX, actualY + 2, 8, 7, bodyColor);
      
      // Nariz
      let noseX = isRight ? headX + 7 : headX - 1;
      drawPixelRect(noseX, actualY + 5, 2, 2, '#ff79c6');

      // Ojos
      let eyeX = isRight ? headX + 3 : headX + 3;
      if (pose === 'happy' || pose === 'love') {
        drawPixelRect(eyeX, actualY + 2, 3, 1, '#000000');
        drawPixelRect(eyeX - 1, actualY + 3, 1, 2, '#000000');
        drawPixelRect(eyeX + 3, actualY + 3, 1, 2, '#000000');
      } else if (pose === 'scared') {
        drawPixelRect(eyeX, actualY + 2, 3, 3, '#ffffff');
        drawPixelRect(eyeX + 1, actualY + 3, 1, 1, '#000000');
      } else {
        drawPixelRect(eyeX, actualY + 3, 2, 2, '#000000');
        drawPixelRect(eyeX, actualY + 3, 1, 1, '#ffffff');
      }

      // Cola
      let tailX = isRight ? x - 8 : x + 16;
      drawPixelRect(tailX, actualY + 6, 8, 2, '#e0a0a0');
      drawPixelRect(isRight ? tailX - 3 : tailX + 8, actualY + 3 + (legOffset * 0.4), 4, 2, '#e0a0a0');

      // Patitas
      drawPixelRect(x + 2 + legOffset, actualY + 10, 3, 2, '#555');
      drawPixelRect(x + 11 - legOffset, actualY + 10, 3, 2, '#555');
    }

    // BANQUETE DE LA CIUDAD
    function drawFeast(x, y) {
      drawPixelRect(x, y - 5, 18, 14, '#f1fa8c');
      drawPixelRect(x + 4, y - 9, 10, 5, '#f1fa8c');
      drawPixelRect(x + 4, y, 4, 4, '#ffb86c');

      drawPixelRect(x + 22, y - 2, 16, 10, '#ff5555');
      drawPixelRect(x + 24, y - 4, 12, 3, '#ff79c6');
      drawPixelRect(x + 22, y - 2, 3, 10, '#ffffff');

      drawPixelRect(x + 42, y + 1, 12, 7, '#ffb86c');
      drawPixelRect(x + 44, y - 1, 8, 3, '#ff79c6');
    }

    // PARTÍCULAS
    function createHeart(x, y) {
      particles.push({
        x: x + (Math.random() * 16 - 8),
        y: y,
        vy: -0.3,
        life: 70,
        color: Math.random() > 0.3 ? '#ff79c6' : '#bd93f9'
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        drawPixelRect(p.x, p.y, 5, 5, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 3, 1, p.color);

        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // SUBTÍTULOS
    function drawSubtitle(text, speaker = "") {
      drawFixedPixelRect(20, 190, 440, 72, '#000000');
      drawFixedPixelRect(22, 192, 436, 68, '#ffffff');
      drawFixedPixelRect(24, 194, 432, 64, '#0d1117');

      if (speaker) {
        ctx.fillStyle = '#ff79c6';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(speaker, 34, 210);
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      
      let lines = text.split('\n');
      lines.forEach((line, index) => {
        ctx.fillText(line, 34, speaker ? 225 + (index * 13) : 215 + (index * 13));
      });
    }

    // BUCLE NARRATIVO CON TIEMPOS MÁXIMOS DE LECTURA (60 FPS = 1 segundo por cada 60 frames)
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();
      drawCat(catX, catY);

      if (state === 0) {
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');
        drawSubtitle("Haz clic en 'Iniciar Historia' para comenzar la fuga.");
      }
      else if (state === 1) {
        // Inicio de Persecución
        catShow = true;
        if (m1X < 240) {
          m1X += 1.0;
          m2X += 1.0;
          catX += 0.95;
          drawMouse(m1X, mY, true, false, 'run');
          drawMouse(m2X, mY, true, true, 'run');
        } else {
          state = 2;
          timer = 0;
        }
        drawSubtitle("¡RÁPIDO! ¡El gato de la ciudad nos ha visto!", "ÉL:");
      }
      else if (state === 2) {
        // Pausa de escape (~12 segundos)
        timer++;
        drawMouse(m1X, mY, true, false, 'scared');
        drawMouse(m2X, mY, true, true, 'scared');

        drawSubtitle("¡Corre al escondite detrás de la tubería!\n¡No mires atrás!", "ÉL:");

        if (timer > 720) { state = 3; timer = 0; }
      }
      else if (state === 3) {
        // Escapan
        if (m1X < 500) {
          m1X += 1.3;
          m2X += 1.3;
          catX += 0.5;
          cameraX += 0.9;
          drawMouse(m1X, mY, true, false, 'run');
          drawMouse(m2X, mY, true, true, 'run');
        } else {
          catShow = false;
          state = 4;
          timer = 0;
        }
        drawSubtitle("Logran escabullirse por una grieta estrecha a salvo...");
      }
      else if (state === 4) {
        // Encuentran el Banquete (~14 segundos)
        timer++;
        drawFeast(550, 175);
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Uff... Lo logramos... perdimos al gato.\nY mira esto... jamás había visto tanta comida junta.", "ÉL:");

        if (timer > 840) { state = 5; timer = 0; }
      }
      else if (state === 5) {
        // Admiración de la comida (~14 segundos)
        timer++;
        drawFeast(550, 175);
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Quesos maduros, carne, dulces de panadería...\nEn la ciudad la comida abunda por todas partes.", "ÉL:");

        if (timer > 840) { state = 6; timer = 0; }
      }
      else if (state === 6) {
        // Ella camina ULTRA DESPACIO hacia él
        drawFeast(550, 175);
        if (m2X < 485) {
          m2X += 0.05; // Movimiento imperceptible y dulce
          drawMouse(m1X, mY, true, false, 'normal');
          drawMouse(m2X, mY, true, true, 'walk');
        } else {
          state = 65;
          timer = 0;
        }
        drawSubtitle("Ella camina pacíficamente hacia él rodeada del banquete...");
      }
      else if (state === 65) {
        // Pausa al llegar (~10 segundos)
        timer++;
        drawFeast(550, 175);
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Ella mira los manjares y luego lo mira con ternura...");

        if (timer > 600) { state = 7; timer = 0; }
      }
      else if (state === 7) {
        // Dialéctica Anime 1 (~16 segundos)
        timer++;
        drawFeast(550, 175);
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, false, true, 'happy');

        drawSubtitle("Dicen que la rata de ciudad vive una vida corta y peligrosa,\nsiempre huyendo de trampas y gatos a cambio de lujos...", "ELLA:");

        if (timer > 960) { state = 8; timer = 0; }
      }
      else if (state === 8) {
        // Tu frase personalizada (~18 segundos de tiempo de lectura)
        timer++;
        drawFeast(550, 175);
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, false, true, 'happy');

        drawSubtitle("Es verdad que la vida de una rata de ciudad es corta...\npero quisiera pasar cada segundo de ella a tu lado.", "ELLA:");

        if (timer > 1080) { state = 9; timer = 0; }
      }
      else if (state === 9) {
        // Final Romántico Incondicional (Infinito)
        timer++;
        drawFeast(550, 175);
        drawMouse(m1X, mY, true, false, 'happy');
        drawMouse(m2X, mY, false, true, 'love');

        if (frame % 10 === 0) {
          createHeart(m1X + 15, 160);
        }

        drawSubtitle("No importa qué tan cruel sea la ciudad ni los gatos que acechen,\nmientras estemos juntos, este lugar es perfecto. 💖", "ELLA:");
      }

      updateParticles();
      requestAnimationFrame(gameLoop);
    }

    function startStory() {
      if (state === 0) {
        state = 1;
        m1X = 30;
        m2X = 5;
        catX = -120;
        cameraX = 0;
        timer = 0;
      }
    }

    function resetStory() {
      state = 0;
      m1X = 30;
      m2X = 5;
      catX = -120;
      cameraX = 0;
      timer = 0;
      catShow = false;
      particles = [];
    }

    gameLoop();
  </script>
</body>
</html>
