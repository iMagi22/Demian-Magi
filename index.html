<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escena 8-Bits</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 25px rgba(255, 121, 198, 0.3);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #bd93f9;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 3px 3px 0px #000;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #ff79c6;
      color: #fff;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #000;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <canvas id="gameCanvas" width="256" height="224"></canvas>
  </div>

  <div class="controls">
    <button onclick="startAnimation()">▶ Reproducir</button>
    <button onclick="resetAnimation()">↺ Reiniciar</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalar la vista sin perder la nitidez de píxeles (256x224 a escala 3x)
    canvas.style.width = (canvas.width * 3) + 'px';
    canvas.style.height = (canvas.height * 3) + 'px';

    let frame = 0;
    let animState = 0; // 0: Inicio, 1: Caminar, 2: Flores + Ojos Corazón, 3: Beso
    let timer = 0;
    let particles = [];

    // Posiciones iniciales
    let boyX = 65;
    let girlX = 175;

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // Fondo: Noche, Luna, Ciudad, Carro Negro Deportivo
    function drawBackground() {
      // Cielo Nocturno
      drawPixelRect(0, 0, 256, 160, '#090a14');

      // Estrellas
      let stars = [[15, 20], [45, 35], [85, 15], [135, 28], [175, 18], [225, 40], [200, 70], [30, 80]];
      stars.forEach(([sx, sy], i) => {
        if ((frame + i * 12) % 45 < 30) {
          drawPixelRect(sx, sy, 2, 2, '#ffffff');
        }
      });

      // Luna brillante
      drawPixelRect(210, 15, 18, 18, '#ffffe0');
      drawPixelRect(208, 18, 22, 12, '#ffffe0');

      // Siluetas de edificios en el horizonte
      drawPixelRect(10, 85, 30, 75, '#121324');
      drawPixelRect(45, 65, 35, 95, '#181a30');
      drawPixelRect(85, 95, 25, 65, '#121324');
      drawPixelRect(150, 75, 40, 85, '#181a30');
      drawPixelRect(195, 90, 30, 70, '#121324');

      // Luces lejanas de los edificios
      drawPixelRect(53, 75, 3, 4, '#ffb86c');
      drawPixelRect(62, 90, 3, 4, '#f1fa8c');
      drawPixelRect(162, 85, 3, 4, '#ff79c6');

      // Suelo / Calle
      drawPixelRect(0, 160, 256, 64, '#21222c');
      drawPixelRect(0, 160, 256, 3, '#44475a');

      // Farola de calle
      drawPixelRect(25, 95, 4, 65, '#6272a4');
      drawPixelRect(21, 91, 12, 4, '#6272a4');
      drawPixelRect(23, 93, 8, 3, '#ffffa0'); // Luz farola
      ctx.fillStyle = 'rgba(255, 255, 160, 0.07)';
      ctx.beginPath();
      ctx.moveTo(27, 96);
      ctx.lineTo(5, 180);
      ctx.lineTo(65, 180);
      ctx.fill();

      // Carro Negro Deportivo
      let carX = 90;
      let carY = 135;
      drawPixelRect(carX, carY + 10, 76, 18, '#111116'); // Chasis
      drawPixelRect(carX + 12, carY, 48, 12, '#181920'); // Techo
      drawPixelRect(carX + 16, carY + 2, 16, 8, '#383a59'); // Ventana izq
      drawPixelRect(carX + 38, carY + 2, 18, 8, '#383a59'); // Ventana der
      drawPixelRect(carX + 2, carY + 12, 4, 5, '#ff5555'); // Faro trasero
      // Llantas
      drawPixelRect(carX + 12, carY + 24, 14, 10, '#000');
      drawPixelRect(carX + 52, carY + 24, 14, 10, '#000');
      drawPixelRect(carX + 16, carY + 27, 6, 4, '#6272a4');
      drawPixelRect(carX + 56, carY + 27, 6, 4, '#6272a4');
    }

    // Dibujar a ÉL (Audífonos grandes, físico musculoso, camiseta negra con dibujo rojo)
    function drawBoy(x, y, showFlowers = false, pose = 'normal') {
      // Cabello castaño/oscuro peinado
      drawPixelRect(x + 2, y, 12, 5, '#211613');

      // Audífonos de Diadema
      drawPixelRect(x - 1, y + 2, 4, 7, '#282a36');
      drawPixelRect(x + 13, y + 2, 4, 7, '#282a36');
      drawPixelRect(x + 1, y - 2, 14, 3, '#44475a');

      // Rostro
      drawPixelRect(x + 3, y + 4, 10, 9, '#f1c27d');
      drawPixelRect(x + 5, y + 7, 2, 2, '#111'); // Ojo izq
      drawPixelRect(x + 9, y + 7, 2, 2, '#111'); // Ojo der
      drawPixelRect(x + 6, y + 10, 4, 1, '#9e5638'); // Sonrisa

      // Camiseta Negra con Estampado Rojo
      drawPixelRect(x + 1, y + 13, 14, 14, '#121214');
      drawPixelRect(x + 4, y + 16, 8, 6, '#ff5555'); // Estampado rojo

      // Brazos Musculosos
      if (pose === 'hug') {
        drawPixelRect(x + 12, y + 14, 8, 5, '#f1c27d');
      } else {
        // Brazos definidos a los lados
        drawPixelRect(x - 4, y + 13, 5, 11, '#f1c27d');
        drawPixelRect(x + 15, y + 13, 5, 11, '#f1c27d');
      }

      // Ramo de Flores
      if (showFlowers) {
        let fx = x + 14;
        let fy = y + 11;
        drawPixelRect(fx + 2, fy + 5, 3, 9, '#50fa7b'); // Tallo
        drawPixelRect(fx - 3, fy - 3, 12, 9, '#ff79c6'); // Flores rosa
        drawPixelRect(fx - 1, fy - 5, 8, 9, '#ffb86c'); // Flores amarillas
        drawPixelRect(fx + 1, fy - 1, 4, 4, '#ff5555'); // Centro
      }

      // Pantalones oscuros estilo gym con detalles blancos
      drawPixelRect(x + 2, y + 27, 12, 13, '#191a21');
      drawPixelRect(x + 2, y + 28, 2, 10, '#f8f8f2'); // Línea lateral
      drawPixelRect(x + 1, y + 40, 5, 4, '#282a36');
      drawPixelRect(x + 10, y + 40, 5, 4, '#282a36');
    }

    // Dibujar a ELLA (Cabello largo oscuro con mechas rojas, flequillo, lentes cat-eye)
    function drawGirl(x, y, heartEyes = false, pose = 'normal') {
      // Cabello largo negro
      drawPixelRect(x - 3, y - 2, 20, 24, '#0f0f14');

      // Flequillo y Mechas Rojas
      drawPixelRect(x + 1, y - 1, 12, 4, '#ff3344'); // Mechas frontales
      drawPixelRect(x - 2, y + 2, 4, 16, '#ff3344');  // Mecha lateral izq
      drawPixelRect(x + 12, y + 4, 4, 14, '#ff3344'); // Mecha lateral der

      // Rostro
      drawPixelRect(x + 3, y + 4, 10, 8, '#ffdbac');

      // Lentes estilo Cat-Eye Negros
      drawPixelRect(x + 2, y + 4, 12, 4, '#000');
      drawPixelRect(x + 1, y + 3, 3, 2, '#000');
      drawPixelRect(x + 12, y + 3, 3, 2, '#000');
      // Cristales de los lentes
      drawPixelRect(x + 3, y + 5, 3, 2, '#f8f8f2');
      drawPixelRect(x + 10, y + 5, 3, 2, '#f8f8f2');

      // Ojos de Corazón al emocionarse
      if (heartEyes) {
        drawPixelRect(x + 3, y + 4, 4, 4, '#ff5555');
        drawPixelRect(x + 9, y + 4, 4, 4, '#ff5555');
        drawPixelRect(x + 4, y + 4, 2, 1, '#ff79c6');
        drawPixelRect(x + 10, y + 4, 2, 1, '#ff79c6');
      }

      // Labios Rojos
      drawPixelRect(x + 6, y + 10, 4, 1, '#ff2244');

      // Camiseta gráfica oscura
      drawPixelRect(x + 3, y + 12, 10, 12, '#1e1e28');
      drawPixelRect(x + 5, y + 14, 6, 6, '#ff79c6'); // Gráfico frontal

      // Brazos y Poses
      if (pose === 'excited') {
        // Manos arriba emocionada
        drawPixelRect(x - 3, y + 6, 4, 8, '#ffdbac');
        drawPixelRect(x + 13, y + 6, 4, 8, '#ffdbac');
      } else if (pose === 'hug') {
        drawPixelRect(x - 4, y + 13, 8, 4, '#ffdbac');
      } else {
        drawPixelRect(x + 1, y + 12, 3, 10, '#ffdbac');
        drawPixelRect(x + 12, y + 12, 3, 10, '#ffdbac');
      }

      // Pantalón y Zapatos
      drawPixelRect(x + 4, y + 24, 8, 14, '#282a36');
      drawPixelRect(x + 3, y + 38, 4, 4, '#111');
      drawPixelRect(x + 9, y + 38, 4, 4, '#111');
    }

    // Partículas de Corazón
    function createHeartParticle(x, y) {
      particles.push({
        x: x + (Math.random() * 16 - 8),
        y: y,
        vy: - (Math.random() * 0.8 + 0.4),
        life: 50,
        color: Math.random() > 0.5 ? '#ff5555' : '#ff79c6'
      });
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        // Corazón pixelado
        drawPixelRect(p.x, p.y, 6, 6, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 4, 1, p.color);
        drawPixelRect(p.x + 2, p.y + 6, 2, 1, p.color);

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    // Loop del Canvas
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();

      if (animState === 0) {
        // Parados frente al carro negro
        drawBoy(boyX, 116, false, 'normal');
        drawGirl(girlX, 116, false, 'normal');
      } 
      else if (animState === 1) {
        // Acercándose
        if (boyX < 102) boyX += 0.6;
        if (girlX > 138) girlX -= 0.6;

        drawBoy(boyX, 116, false, 'normal');
        drawGirl(girlX, 116, false, 'normal');

        if (boyX >= 102 && girlX <= 138) {
          animState = 2;
          timer = 0;
        }
      } 
      else if (animState === 2) {
        // ÉL saca las flores, ELLA pone ojos de corazón y se emociona
        timer++;
        drawBoy(boyX, 116, true, 'normal');
        drawGirl(girlX, 116, true, 'excited');

        if (timer > 80) {
          animState = 3;
          boyX = 112;
          girlX = 120;
        }
      } 
      else if (animState === 3) {
        // ¡BESO Y CORAZONES!
        drawBoy(boyX, 116, true, 'hug');
        drawGirl(girlX, 116, true, 'hug');

        // Corazón grande sobre ellos
        drawPixelRect(121, 100, 10, 10, '#ff5555');

        if (frame % 7 === 0) {
          createHeartParticle(122, 106);
        }
      }

      updateAndDrawParticles();
      requestAnimationFrame(gameLoop);
    }

    function startAnimation() {
      if (animState === 0) {
        animState = 1;
      }
    }

    function resetAnimation() {
      animState = 0;
      boyX = 65;
      girlX = 175;
      timer = 0;
      particles = [];
    }

    // Iniciar loop
    gameLoop();
  </script>
</body>
</html>
