<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rata de Campo - Chainsaw Man Metaphor</title>
  <style>
    body {
      background-color: #050608;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 16px;
      color: #50fa7b;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 2px 2px #000;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 35px rgba(80, 250, 123, 0.3);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #50fa7b;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 22px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #8be9fd;
      color: #000;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <h1>[ RATA DE CAMPO - CHAINSAW MAN ]</h1>

  <div class="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
  </div>

  <div class="controls">
    <button onclick="startStory()">▶ Ver Historia</button>
    <button onclick="resetStory()">↺ Reiniciar</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalado de pantalla
    canvas.style.width = (canvas.width * 2.3) + 'px';
    canvas.style.height = (canvas.height * 2.3) + 'px';

    let frame = 0;
    let state = 0;
    let timer = 0;
    let particles = [];

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // FONDO: CAMPO NOCTURNO Y PACÍFICO
    function drawBackground() {
      // Cielo Nocturno
      drawPixelRect(0, 0, 480, 100, '#0a0d1d');
      drawPixelRect(0, 100, 480, 50, '#111827');
      drawPixelRect(0, 150, 480, 40, '#1a2332');

      // Estrellas
      let stars = [
        [30, 20], [80, 45], [130, 15], [190, 35], [250, 10], 
        [310, 50], [380, 25], [440, 40], [210, 65], [350, 75]
      ];
      stars.forEach(([sx, sy], i) => {
        if ((frame + i * 12) % 40 < 28) {
          drawPixelRect(sx, sy, 2, 2, '#f1fa8c');
        }
      });

      // Luna Llena en el Campo
      drawPixelRect(390, 15, 30, 30, '#ffb86c');
      drawPixelRect(386, 20, 38, 20, '#ffb86c');

      // Montañas al fondo
      drawPixelRect(0, 130, 120, 60, '#0d1520');
      drawPixelRect(80, 110, 150, 80, '#0a1018');
      drawPixelRect(200, 125, 180, 65, '#0d1520');
      drawPixelRect(350, 105, 130, 85, '#0a1018');

      // Suelo de Hierba
      drawPixelRect(0, 180, 480, 90, '#1b3a21');
      drawPixelRect(0, 180, 480, 6, '#2e6f40');

      // Briznas de Pasto Animadas por el viento
      for (let i = 10; i < 480; i += 22) {
        let wind = Math.sin((frame + i) * 0.05) * 2;
        drawPixelRect(i, 174, 3, 8, '#50fa7b');
        drawPixelRect(i + wind, 170, 2, 5, '#50fa7b');
      }

      // Pequeñas flores de campo
      let flowers = [[50, 195], [120, 205], [320, 198], [410, 205], [260, 202]];
      flowers.forEach(([fx, fy]) => {
        drawPixelRect(fx, fy, 3, 3, '#ff79c6');
        drawPixelRect(fx + 1, fy - 1, 1, 1, '#ffffff');
      });
    }

    // DIBUJAR RATA DE CAMPO (8-Bits)
    function drawMouse(x, y, isRight = false, isHappy = false) {
      let dir = isRight ? 1 : -1;

      // Cuerpo
      drawPixelRect(x, y, 16, 10, '#8b8c8e');
      drawPixelRect(x + 2, y - 2, 12, 3, '#a2a3a5'); // Espalda

      // Orejas grandes y tiernas
      let earX = isRight ? x + 2 : x + 10;
      drawPixelRect(earX, y - 6, 5, 5, '#ffb86c');
      drawPixelRect(earX + 1, y - 5, 3, 3, '#ff9999');

      // Cabeza / Hocico
      let headX = isRight ? x + 12 : x - 6;
      drawPixelRect(headX, y + 2, 8, 7, '#8b8c8e');
      
      // Nariz rosada
      let noseX = isRight ? headX + 7 : headX - 1;
      drawPixelRect(noseX, y + 5, 2, 2, '#ff79c6');

      // Ojo expresivo
      let eyeX = isRight ? headX + 3 : headX + 3;
      if (isHappy) {
        // Ojo de felicidad (^ ^)
        drawPixelRect(eyeX, y + 2, 3, 1, '#000000');
        drawPixelRect(eyeX - 1, y + 3, 1, 2, '#000000');
        drawPixelRect(eyeX + 3, y + 3, 1, 2, '#000000');
      } else {
        drawPixelRect(eyeX, y + 3, 2, 2, '#000000');
        drawPixelRect(eyeX, y + 3, 1, 1, '#ffffff'); // brillo
      }

      // Cola larga curbeada
      let tailX = isRight ? x - 8 : x + 16;
      drawPixelRect(tailX, y + 6, 8, 2, '#e0a0a0');
      drawPixelRect(isRight ? tailX - 3 : tailX + 8, y + 3, 4, 2, '#e0a0a0');

      // Patitas
      drawPixelRect(x + 2, y + 10, 3, 2, '#666');
      drawPixelRect(x + 11, y + 10, 3, 2, '#666');
    }

    // POCA COMIDA: UN PEQUEÑO TROZO DE QUESO
    function drawFood(x, y) {
      drawPixelRect(x, y, 10, 8, '#f1fa8c');
      drawPixelRect(x + 2, y - 2, 6, 3, '#f1fa8c');
      drawPixelRect(x + 3, y + 2, 2, 2, '#ffb86c'); // Agujerito del queso
      drawPixelRect(x + 7, y + 4, 2, 2, '#ffb86c');
    }

    // PARTÍCULAS DE AMOR
    function createHeart(x, y) {
      particles.push({
        x: x + (Math.random() * 20 - 10),
        y: y,
        vy: -0.6,
        life: 50,
        color: '#ff79c6'
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        drawPixelRect(p.x, p.y, 5, 5, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 3, 1, p.color);

        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // CAJA DE SUBTÍTULOS
    function drawSubtitle(text, speaker = "") {
      drawPixelRect(30, 205, 420, 55, '#000000');
      drawPixelRect(32, 207, 416, 51, '#ffffff');
      drawPixelRect(34, 209, 412, 47, '#0d1117');

      if (speaker) {
        ctx.fillStyle = '#ff79c6';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(speaker, 46, 224);
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      
      // Ajuste de texto multi-línea básico
      let lines = text.split('\n');
      lines.forEach((line, index) => {
        ctx.fillText(line, 46, speaker ? 238 + (index * 13) : 228 + (index * 13));
      });
    }

    // BUCLE PRINCIPAL
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();

      let mouse1X = 190;
      let mouse2X = 230;
      let mouseY = 172;

      if (state === 0) {
        // Inicio
        drawMouse(mouse1X, mouseY, true, false);
        drawMouse(mouse2X, mouseY, false, false);
        drawFood(215, 176);
        drawSubtitle("¿Prefieres ser la rata de ciudad o la rata de campo?", "REZE:");
      } 
      else if (state === 1) {
        timer++;
        drawMouse(mouse1X, mouseY, true, false);
        drawMouse(mouse2X, mouseY, false, false);
        drawFood(215, 176);
        drawSubtitle("La rata de campo vive en paz y seguridad,\nsin temor a los gatos ni al peligro...", "REZE (CSM):");

        if (timer > 110) { state = 2; timer = 0; }
      } 
      else if (state === 2) {
        timer++;
        drawMouse(mouse1X, mouseY, true, false);
        drawMouse(mouse2X, mouseY, false, false);
        drawFood(215, 176);
        drawSubtitle("Aunque tenga poca comida para compartir,\nnada supera la paz y ser libre.", "METÁFORA:");

        if (timer > 110) { state = 3; timer = 0; }
      } 
      else if (state === 3) {
        // Amándose y felices
        let happyJump = Math.abs(Math.sin(frame * 0.15)) * 3;
        
        drawMouse(mouse1X + 8, mouseY - happyJump, true, true);
        drawMouse(mouse2X - 8, mouseY - happyJump, false, true);
        drawFood(215, 176);

        if (frame % 8 === 0) {
          createHeart(220, 160 - happyJump);
        }

        drawSubtitle("Libres, felices y juntos en el campo. 💖", "RATA DE CAMPO:");
      }

      updateParticles();
      requestAnimationFrame(gameLoop);
    }

    function startStory() {
      if (state === 0) {
        state = 1;
        timer = 0;
      }
    }

    function resetStory() {
      state = 0;
      timer = 0;
      particles = [];
    }

    gameLoop();
  </script>
</body>
</html>
