<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rata de Campo - Escena Súper Lenta 8-Bits</title>
  <style>
    body {
      background-color: #050608;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 16px;
      color: #50fa7b;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 2px 2px #000;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 35px rgba(80, 250, 123, 0.3);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #50fa7b;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 22px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #ff79c6;
      color: #fff;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <h1>[ LA RATA DE CAMPO - EDICIÓN PAUSADA ]</h1>

  <div class="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
  </div>

  <div class="controls">
    <button onclick="startStory()">▶ Iniciar Historia</button>
    <button onclick="resetStory()">↺ Reiniciar Escena</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalado de pantalla
    canvas.style.width = (canvas.width * 2.3) + 'px';
    canvas.style.height = (canvas.height * 2.3) + 'px';

    let frame = 0;
    let state = 0;
    let timer = 0;
    let particles = [];

    // Scroll de la caminata larga
    let cameraX = 0;
    let m1X = -30;
    let m2X = -60;
    let mY = 172;
    let cheeseX = 520;

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x - cameraX), Math.round(y), w, h);
    }

    function drawFixedPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // FONDO: CAMPO NOCTURNO
    function drawBackground() {
      // Cielo Nocturno Fijo
      drawFixedPixelRect(0, 0, 480, 100, '#090c1a');
      drawFixedPixelRect(0, 100, 480, 50, '#101626');
      drawFixedPixelRect(0, 150, 480, 40, '#182030');

      // Estrellas
      let stars = [
        [25, 20], [70, 45], [120, 15], [180, 35], [240, 10], 
        [300, 50], [370, 25], [430, 40], [200, 65], [340, 75],
        [450, 15], [90, 75], [150, 50], [280, 25]
      ];
      stars.forEach(([sx, sy], i) => {
        if ((frame + i * 10) % 40 < 28) {
          drawFixedPixelRect(sx, sy, 2, 2, '#ffffff');
        }
      });

      // Luna Llena
      drawFixedPixelRect(390, 15, 28, 28, '#ffb86c');
      drawFixedPixelRect(386, 20, 36, 18, '#ffb86c');

      // Montañas lejanas
      for (let i = -100; i < 900; i += 180) {
        drawPixelRect(i, 130, 140, 60, '#0c121c');
        drawPixelRect(i + 80, 110, 160, 80, '#090e17');
      }

      // Suelo de Hierba
      drawFixedPixelRect(0, 180, 480, 90, '#17331c');
      drawFixedPixelRect(0, 180, 480, 6, '#286338');

      // Briznas de Pasto Animadas
      for (let i = -50; i < 900; i += 18) {
        let wind = Math.sin((frame + i) * 0.04) * 2;
        drawPixelRect(i, 174, 3, 8, '#50fa7b');
        drawPixelRect(i + wind, 170, 2, 5, '#50fa7b');
      }

      // Flores silvestres de campo
      let flowers = [[40, 195], [110, 205], [290, 198], [420, 205], [600, 195], [720, 202]];
      flowers.forEach(([fx, fy]) => {
        drawPixelRect(fx, fy, 3, 3, '#ff79c6');
        drawPixelRect(fx + 1, fy - 1, 1, 1, '#ffffff');
      });
    }

    // DIBUJAR RATA DE CAMPO
    function drawMouse(x, y, isRight = true, isGirl = false, pose = 'normal') {
      let isMoving = (pose === 'walk');
      let legOffset = isMoving ? Math.sin(frame * 0.15) * 2.5 : 0;
      let happyJump = (pose === 'happy' || pose === 'love') ? Math.abs(Math.sin(frame * 0.12)) * 4 : 0;
      let actualY = y - happyJump;

      let bodyColor = isGirl ? '#a88b80' : '#8b8c8e';
      let backColor = isGirl ? '#bc9e92' : '#a2a3a5';

      // Cuerpo
      drawPixelRect(x, actualY, 16, 10, bodyColor);
      drawPixelRect(x + 2, actualY - 2, 12, 3, backColor);

      // Orejas
      let earX = isRight ? x + 2 : x + 10;
      drawPixelRect(earX, actualY - 6, 5, 5, '#ffb86c');
      drawPixelRect(earX + 1, actualY - 5, 3, 3, '#ff9999');

      // Flor en la oreja de ella
      if (isGirl) {
        drawPixelRect(earX - 2, actualY - 6, 3, 3, '#ff79c6');
      }

      // Cabeza
      let headX = isRight ? x + 12 : x - 6;
      drawPixelRect(headX, actualY + 2, 8, 7, bodyColor);
      
      // Nariz
      let noseX = isRight ? headX + 7 : headX - 1;
      drawPixelRect(noseX, actualY + 5, 2, 2, '#ff79c6');

      // Ojos
      let eyeX = isRight ? headX + 3 : headX + 3;
      if (pose === 'happy' || pose === 'love') {
        drawPixelRect(eyeX, actualY + 2, 3, 1, '#000000');
        drawPixelRect(eyeX - 1, actualY + 3, 1, 2, '#000000');
        drawPixelRect(eyeX + 3, actualY + 3, 1, 2, '#000000');
      } else {
        drawPixelRect(eyeX, actualY + 3, 2, 2, '#000000');
        drawPixelRect(eyeX, actualY + 3, 1, 1, '#ffffff');
      }

      // Cola
      let tailX = isRight ? x - 8 : x + 16;
      drawPixelRect(tailX, actualY + 6, 8, 2, '#e0a0a0');
      drawPixelRect(isRight ? tailX - 3 : tailX + 8, actualY + 3 + (legOffset * 0.4), 4, 2, '#e0a0a0');

      // Patitas
      drawPixelRect(x + 2 + legOffset, actualY + 10, 3, 2, '#555');
      drawPixelRect(x + 11 - legOffset, actualY + 10, 3, 2, '#555');
    }

    // POCA COMIDA: QUESO
    function drawFood(x, y) {
      drawPixelRect(x, y, 9, 7, '#f1fa8c');
      drawPixelRect(x + 2, y - 2, 5, 3, '#f1fa8c');
      drawPixelRect(x + 2, y + 2, 2, 2, '#ffb86c');
    }

    // PARTÍCULAS DE CORAZONES
    function createHeart(x, y) {
      particles.push({
        x: x + (Math.random() * 16 - 8),
        y: y,
        vy: -0.3,
        life: 70,
        color: Math.random() > 0.3 ? '#ff79c6' : '#ff3366'
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        drawPixelRect(p.x, p.y, 5, 5, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 3, 1, p.color);

        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // SUBTÍTULOS
    function drawSubtitle(text, speaker = "") {
      drawFixedPixelRect(20, 200, 440, 60, '#000000');
      drawFixedPixelRect(22, 202, 436, 56, '#ffffff');
      drawFixedPixelRect(24, 204, 432, 52, '#0d1117');

      if (speaker) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(speaker, 36, 220);
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      
      let lines = text.split('\n');
      lines.forEach((line, index) => {
        ctx.fillText(line, 36, speaker ? 234 + (index * 13) : 224 + (index * 13));
      });
    }

    // BUCLE NARRATIVO CON ACERCAMIENTO ULTRA LENTO
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();

      drawFood(cheeseX, 176);

      if (state === 0) {
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');
        drawSubtitle("Haz clic en 'Iniciar Historia' para comenzar.");
      }
      else if (state === 1) {
        // Caminata inicial
        if (m1X < 180) {
          m1X += 0.4;
          m2X += 0.4;
          drawMouse(m1X, mY, true, false, 'walk');
          drawMouse(m2X, mY, true, true, 'walk');
        } else {
          state = 2;
          timer = 0;
        }
        drawSubtitle("Buscando algo de comer en la inmensidad de la noche...");
      }
      else if (state === 2) {
        // Pausa conversacional
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Llevamos mucho tiempo buscando...\nLa comida no abunda por aquí.", "ÉL:");

        if (timer > 400) { state = 3; timer = 0; }
      }
      else if (state === 3) {
        // Segunda caminata
        if (m1X < 490) {
          m1X += 0.4;
          m2X += 0.4;
          cameraX += 0.28;
          drawMouse(m1X, mY, true, false, 'walk');
          drawMouse(m2X, mY, true, true, 'walk');
        } else {
          state = 4;
          timer = 0;
        }
        drawSubtitle("Siguen recorriendo la hierba bajo las estrellas...");
      }
      else if (state === 4) {
        // Encuentran el queso
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("¡Mira! Encontré un pedacito de queso...", "ÉL:");

        if (timer > 450) { state = 5; timer = 0; }
      }
      else if (state === 5) {
        // Ofrece el queso
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Sé que es muy poco, pero quiero que te lo quedes tú.\nNecesitas comer algo.", "ÉL:");

        if (timer > 500) { state = 6; timer = 0; }
      }
      else if (state === 6) {
        // Ella camina ULTRA DESPACIO hacia él
        if (m2X < 475) {
          m2X += 0.12; // Velocidad reducida a más de la mitad
          drawMouse(m1X, mY, true, false, 'normal');
          drawMouse(m2X, mY, true, true, 'walk');
        } else {
          state = 65; // Sub-estado para que se quede quieta al llegar antes de cambiar texto
          timer = 0;
        }
        drawSubtitle("Ella se acerca a él dulcemente...");
      }
      else if (state === 65) {
        // Pausa al llegar (350 frames ≈ 6 segundos de tiempo de lectura extra)
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Ella se acerca a él dulcemente...");

        if (timer > 350) { state = 7; timer = 0; }
      }
      else if (state === 7) {
        // Filosofía 1 (~10 segundos)
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, false, true, 'happy');

        drawSubtitle("No me importa que tengamos poca comida...", "ELLA:");

        if (timer > 600) { state = 8; timer = 0; }
      }
      else if (state === 8) {
        // Filosofía 2 (~11.5 segundos)
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, false, true, 'happy');

        drawSubtitle("La rata de campo vive libre aunque tenga poco que comer.\nSin trampas, sin gatos y sin miedo.", "ELLA:");

        if (timer > 700) { state = 9; timer = 0; }
      }
      else if (state === 9) {
        // Final romántico
        timer++;
        drawMouse(m1X, mY, true, false, 'happy');
        drawMouse(m2X, mY, false, true, 'love');

        if (frame % 10 === 0) {
          createHeart(m1X + 15, 160);
        }

        drawSubtitle("En un mundo donde tengamos poco o mucho...\nyo siempre elegiría estar contigo. 💖", "ELLA:");
      }

      updateParticles();
      requestAnimationFrame(gameLoop);
    }

    function startStory() {
      if (state === 0) {
        state = 1;
        m1X = 40;
        m2X = 10;
        cameraX = 0;
        timer = 0;
      }
    }

    function resetStory() {
      state = 0;
      m1X = 40;
      m2X = 10;
      cameraX = 0;
      timer = 0;
      particles = [];
    }

    gameLoop();
  </script>
</body>
</html>
