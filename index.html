<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rata de Campo - Historia de Amor 8-Bits</title>
  <style>
    body {
      background-color: #050608;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 16px;
      color: #50fa7b;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 2px 2px #000;
    }

    .game-container {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 35px rgba(80, 250, 123, 0.3);
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }

    button {
      background: #50fa7b;
      border: 2px solid #fff;
      color: #000;
      padding: 10px 22px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
    }

    button:hover {
      background: #ff79c6;
      color: #fff;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }
  </style>
</head>
<body>

  <h1>[ LA RATA DE CAMPO ]</h1>

  <div class="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
  </div>

  <div class="controls">
    <button onclick="startStory()">▶ Iniciar Historia</button>
    <button onclick="resetStory()">↺ Reiniciar Escena</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Escalado
    canvas.style.width = (canvas.width * 2.3) + 'px';
    canvas.style.height = (canvas.height * 2.3) + 'px';

    let frame = 0;
    let state = 0;
    let timer = 0;
    let particles = [];

    // Posiciones iniciales (Caminata larga)
    let m1X = 40;
    let m2X = 15;
    let mY = 172;
    let showCheese = false;

    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // FONDO: CAMPO NOCTURNO PACÍFICO Y HERMOSO
    function drawBackground() {
      // Cielo Nocturno
      drawPixelRect(0, 0, 480, 100, '#090c1a');
      drawPixelRect(0, 100, 480, 50, '#101626');
      drawPixelRect(0, 150, 480, 40, '#182030');

      // Estrellas titilantes
      let stars = [
        [25, 20], [70, 45], [120, 15], [180, 35], [240, 10], 
        [300, 50], [370, 25], [430, 40], [200, 65], [340, 75],
        [450, 15], [90, 75], [150, 50], [280, 25]
      ];
      stars.forEach(([sx, sy], i) => {
        if ((frame + i * 10) % 40 < 28) {
          drawPixelRect(sx, sy, 2, 2, '#ffffff');
        }
      });

      // Luna de Campo
      drawPixelRect(390, 15, 28, 28, '#ffb86c');
      drawPixelRect(386, 20, 36, 18, '#ffb86c');

      // Siluetas de Montañas lejanas
      drawPixelRect(0, 130, 140, 60, '#0c121c');
      drawPixelRect(90, 110, 160, 80, '#090e17');
      drawPixelRect(220, 125, 170, 65, '#0c121c');
      drawPixelRect(340, 105, 140, 85, '#090e17');

      // Suelo de Hierba
      drawPixelRect(0, 180, 480, 90, '#17331c');
      drawPixelRect(0, 180, 480, 6, '#286338');

      // Briznas de Pasto Animadas por la brisa
      for (let i = 8; i < 480; i += 18) {
        let wind = Math.sin((frame + i) * 0.04) * 2;
        drawPixelRect(i, 174, 3, 8, '#50fa7b');
        drawPixelRect(i + wind, 170, 2, 5, '#50fa7b');
      }

      // Flores silvestre de campo
      let flowers = [[40, 195], [110, 205], [290, 198], [420, 205], [230, 202]];
      flowers.forEach(([fx, fy]) => {
        drawPixelRect(fx, fy, 3, 3, '#ff79c6');
        drawPixelRect(fx + 1, fy - 1, 1, 1, '#ffffff');
      });
    }

    // DIBUJAR RATA DE CAMPO
    function drawMouse(x, y, isRight = true, isGirl = false, pose = 'normal') {
      let isMoving = (pose === 'walk');
      let legOffset = isMoving ? Math.sin(frame * 0.3) * 2 : 0;
      let happyJump = (pose === 'happy' || pose === 'love') ? Math.abs(Math.sin(frame * 0.2)) * 4 : 0;
      let actualY = y - happyJump;

      // Color base (Él es más grisáceo, Ella tiene un tono más cálido y un moño/detalle)
      let bodyColor = isGirl ? '#a88b80' : '#8b8c8e';
      let backColor = isGirl ? '#bc9e92' : '#a2a3a5';

      // Cuerpo
      drawPixelRect(x, actualY, 16, 10, bodyColor);
      drawPixelRect(x + 2, actualY - 2, 12, 3, backColor);

      // Orejas grandes de campo
      let earX = isRight ? x + 2 : x + 10;
      drawPixelRect(earX, actualY - 6, 5, 5, '#ffb86c');
      drawPixelRect(earX + 1, actualY - 5, 3, 3, '#ff9999');

      // Detalle de Ella: Flor en la oreja
      if (isGirl) {
        drawPixelRect(earX - 2, actualY - 6, 3, 3, '#ff79c6');
      }

      // Cabeza
      let headX = isRight ? x + 12 : x - 6;
      drawPixelRect(headX, actualY + 2, 8, 7, bodyColor);
      
      // Nariz rosada
      let noseX = isRight ? headX + 7 : headX - 1;
      drawPixelRect(noseX, actualY + 5, 2, 2, '#ff79c6');

      // Ojos expresivos
      let eyeX = isRight ? headX + 3 : headX + 3;
      if (pose === 'happy' || pose === 'love') {
        // Ojo de felicidad (^ ^)
        drawPixelRect(eyeX, actualY + 2, 3, 1, '#000000');
        drawPixelRect(eyeX - 1, actualY + 3, 1, 2, '#000000');
        drawPixelRect(eyeX + 3, actualY + 3, 1, 2, '#000000');
      } else {
        drawPixelRect(eyeX, actualY + 3, 2, 2, '#000000');
        drawPixelRect(eyeX, actualY + 3, 1, 1, '#ffffff');
      }

      // Cola Larga Curva
      let tailX = isRight ? x - 8 : x + 16;
      drawPixelRect(tailX, actualY + 6, 8, 2, '#e0a0a0');
      drawPixelRect(isRight ? tailX - 3 : tailX + 8, actualY + 3 + (legOffset * 0.5), 4, 2, '#e0a0a0');

      // Patitas animadas
      drawPixelRect(x + 2 + legOffset, actualY + 10, 3, 2, '#555');
      drawPixelRect(x + 11 - legOffset, actualY + 10, 3, 2, '#555');
    }

    // POCA COMIDA: PEDACITO DE QUESO
    function drawFood(x, y) {
      drawPixelRect(x, y, 9, 7, '#f1fa8c');
      drawPixelRect(x + 2, y - 2, 5, 3, '#f1fa8c');
      drawPixelRect(x + 2, y + 2, 2, 2, '#ffb86c'); // Agujerito
    }

    // PARTÍCULAS DE AMOR
    function createHeart(x, y) {
      particles.push({
        x: x + (Math.random() * 16 - 8),
        y: y,
        vy: -0.5,
        life: 50,
        color: Math.random() > 0.3 ? '#ff79c6' : '#ff3366'
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.vy;
        p.life--;

        drawPixelRect(p.x, p.y, 5, 5, p.color);
        drawPixelRect(p.x + 1, p.y - 1, 3, 1, p.color);

        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // CAJA DE SUBTÍTULOS REFINADA
    function drawSubtitle(text, speaker = "") {
      drawPixelRect(20, 202, 440, 58, '#000000');
      drawPixelRect(22, 204, 436, 54, '#ffffff');
      drawPixelRect(24, 206, 432, 50, '#0d1117');

      if (speaker) {
        ctx.fillStyle = '#50fa7b';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(speaker, 36, 222);
      }

      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      
      let lines = text.split('\n');
      lines.forEach((line, index) => {
        ctx.fillText(line, 36, speaker ? 236 + (index * 13) : 226 + (index * 13));
      });
    }

    // BUCLE NARRATIVO EXTENDIDO
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      drawBackground();

      if (showCheese) {
        drawFood(240, 176);
      }

      // ESTADOS DE LA HISTORIA
      if (state === 0) {
        // Inicio quieto
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');
        drawSubtitle("Presiona 'Iniciar Historia' para comenzar la escena.");
      }
      else if (state === 1) {
        // Escena 1: Caminando juntos a buscar comida
        if (m1X < 190) {
          m1X += 0.8;
          m2X += 0.8;
          drawMouse(m1X, mY, true, false, 'walk');
          drawMouse(m2X, mY, true, true, 'walk');
        } else {
          state = 2;
          timer = 0;
        }
        drawSubtitle("Buscando algo de comer entre la inmensidad del campo...");
      }
      else if (state === 2) {
        // Escena 2: Encuentran el pequeño pedazo de queso
        timer++;
        showCheese = true;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Mira... encontré este pequeño pedacito de queso.", "ÉL:");

        if (timer > 110) { state = 3; timer = 0; }
      }
      else if (state === 3) {
        // Escena 3: Él se lo cede a ella
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, true, true, 'normal');

        drawSubtitle("Es muy poco, pero tómatelo tú. Te dará fuerzas.", "ÉL:");

        if (timer > 110) { state = 4; timer = 0; }
      }
      else if (state === 4) {
        // Escena 4: Ella se acerca amorosamente
        if (m2X < 215) {
          m2X += 0.6;
          drawMouse(m1X, mY, true, false, 'normal');
          drawMouse(m2X, mY, true, true, 'walk');
        } else {
          state = 5;
          timer = 0;
        }
        drawSubtitle("No me importa que sea poco alimento...", "ELLA:");
      }
      else if (state === 5) {
        // Escena 5: La filosofía de la rata de campo
        timer++;
        drawMouse(m1X, mY, true, false, 'normal');
        drawMouse(m2X, mY, false, true, 'happy');

        drawSubtitle("La rata de campo es libre aunque tenga poco que comer,\nsin miedos, sin rejas y sin trampas...", "ELLA:");

        if (timer > 130) { state = 6; timer = 0; }
      }
      else if (state === 6) {
        // Escena 6: Amor incondicional y final feliz
        timer++;
        drawMouse(m1X, mY, true, false, 'happy');
        drawMouse(m2X, mY, false, true, 'love');

        if (frame % 7 === 0) {
          createHeart(220, 160);
        }

        drawSubtitle("Y aún en este mundo tan duro... yo siempre estaría contigo. 💖", "ELLA:");
      }

      updateParticles();
      requestAnimationFrame(gameLoop);
    }

    function startStory() {
      if (state === 0) {
        state = 1;
        m1X = 40;
        m2X = 15;
        showCheese = false;
        timer = 0;
      }
    }

    function resetStory() {
      state = 0;
      m1X = 40;
      m2X = 15;
      showCheese = false;
      timer = 0;
      particles = [];
    }

    gameLoop();
  </script>
</body>
</html>
